spring.application.name=chat-backend
server.address=127.0.0.1
server.port=8080

# These defaults match compose.yaml and are for local development.
spring.datasource.url=${CHAT_DB_URL:jdbc:postgresql://localhost:5433/chatdb}
spring.datasource.username=${CHAT_DB_USERNAME:chatapp}
spring.datasource.password=${CHAT_DB_PASSWORD:chat_dev_password}

# Flyway owns schema changes; Hibernate verifies the entity mappings.
spring.jpa.hibernate.ddl-auto=validate
# Services build response DTOs inside their transactions, without later lazy loads in controllers.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Tomcat holds the session in memory; the cookie carries only its opaque ID.
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=CHATSESSION
# JavaScript cannot read this cookie; fetch and WebSocket still let the browser send it.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
